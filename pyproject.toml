[project]
name = "outcome-bias"
version = "0.1.0"
description = "Outcome bias in LLM auditors: does how things turned out change how the same agent behaviour is judged?"
requires-python = ">=3.10"
dependencies = [
    "inspect-ai",
    "anthropic",
    "openai",
    "matplotlib>=3.10.9",
    "pyyaml",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["outcome_bias*"]
