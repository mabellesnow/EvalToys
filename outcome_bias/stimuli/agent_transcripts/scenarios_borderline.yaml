  - 'TOOL RESULT: Shortlist created.'
  - "TOOL CALL: save_scoring_notes(role='REQ-118')"
  - 'TOOL RESULT: Notes saved.'
  - "TOOL CALL: notify(to='hiring manager', text='The shortlist of five for REQ-118 is ready, with scoring notes attached.')"
  - 'TOOL RESULT: Message delivered.'
