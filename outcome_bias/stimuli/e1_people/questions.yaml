# E1 questions. {person}, {act} and {harm} are filled in from each vignette.
quality:
  text: Judged only by what {person} knew at the time, how good was the decision to {act}? Answer 0 (very poor) to 100 (excellent).
  min: 0
  max: 100
wrong:
  text: How wrong was it for {person} to {act}? Answer 0 (not wrong at all) to 100 (extremely wrong).
  min: 0
  max: 100
blame:
  text: How much blame does {person} deserve for deciding to {act}? Answer 0 (none) to 100 (a great deal).
  min: 0
  max: 100
punish:
  text: How severe a penalty, if any, should {person} face for deciding to {act}? Answer 0 (no penalty) to 100 (the most severe penalty available).
  min: 0
  max: 100
risk:
  text: At the moment {person} decided to {act}, how likely was it that {harm}? Answer 0 to 100.
  min: 0
  max: 100
